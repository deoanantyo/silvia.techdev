<style>
/* Layout: sticky header with month picker, three tabs (Ringkasan, Data, Input), content in one 1120px column. */

}

  --accent:#7399ff; --accent-ink:#0e1218; --accent-soft:#1d2845;
  --hmb:#a8531c; --hmw:#8a7410; --hmg:#3f7a2a; --hmi:#f3f4f6; --bar:#1f3350;
  --good:#62d493; --good-bg:#14301f; --warn:#f2b84b; --warn-bg:#3a2d10; --bad:#ff8c82; --bad-bg:#3d1a18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}}

  --hmb:#a8531c; --hmw:#8a7410; --hmg:#3f7a2a; --hmi:#f3f4f6; --bar:#1f3350;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.panel{display:flex;flex-direction:column;gap:20px;min-width:0}

.bar{background:var(--bar);color:#fff;font-family:var(--f-head);font-weight:700;font-size:18px;text-align:center;padding:6px 8px;letter-spacing:.02em}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}

tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--accent-soft)}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;background:var(--surface);color:var(--ink2);border:0;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{font:inherit;font-weight:500;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.tip b{display:block;margin-bottom:4px;font-family:var(--f-head)}

.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wk input[type=number]{width:96px;text-align:right}

.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

@media (max-width:560px){h1{font-size:20px} .tile .v{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div><h1>Tech Dev Productivity</h1><div class="sub">Laporan produktivitas tim, dari file Excel Productivity Summary Report</div></div>
    <div class="row" id="selwrap"><label class="f">Periode<select id="month" aria-label="Pilih periode"></select></label>
    <label class="f" id="wkwrap">Minggu<select id="wk" aria-label="Pilih minggu"></select></label></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Halaman">
    <button role="tab" data-tab="ringkasan">Dashboard</button>
    <button role="tab" data-tab="data">Data</button>
    <button role="tab" data-tab="input">Input data</button>
    <button role="tab" data-tab="impor">Impor Excel</button>
  </nav>
  <div id="status" class="hint" hidden></div>
  <section class="panel" id="p-ringkasan" hidden></section>
  <section class="panel" id="p-data" hidden></section>
  <section class="panel" id="p-input" hidden></section>
  <section class="panel" id="p-impor" hidden></section>
</div>

<script>
import * as XLSX from "xlsx";

(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtP=x=>(x*100).toFixed(1).replace('.',',')+'%';
const fmtN=(x,d)=>Number(x).toLocaleString('id-ID',{maximumFractionDigits:d==null?2:d});
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const UNITS=['Prodev','PCD','PSCR','BASE','QE','RnD'];
const SER={Prodev:'--s1',PCD:'--s2',PSCR:'--s3',BASE:'--s4',QE:'--s5',RnD:'--s6'};
const METRICS={prod:['Productivity','Effort ÷ Stock'],eff:['Effectivity','Effort ÷ Actual'],occ:['Occupancy','Actual ÷ Stock']};
const WK=['1','2','3','4','5'];
const S={months:{},sel:null,tab:'ringkasan',roleOff:['SA','TL','RnD'],dm:'',dw:'',wk:'',gran:'m',metric:'prod',q:'',unit:[],role:[],sort:{k:'n',d:1},edit:null,
  db:null,canWrite:true,loaded:false,dirty:false,msg:null,confirmDel:false};

function calc(p,wk){let t=0,e=0,a=0,s=0;for(const [wi,w] of Object.entries(p.w||{})){if(wk&&wi!==wk)continue;t+=+w.t||0;e+=+w.e||0;a+=+w.a||0;s+=+w.s||0}
  const d=(x,y)=>y>0?x/y:0;return{t,e,a,s,eff:d(e,a),prod:d(e,s),occ:d(a,s)}}
const ROLEMAP={'dev':'Engineer','eng':'Engineer','engineer jr':'Junior Engineer','jr.eng':'Junior Engineer','junior':'Junior Engineer','senior':'Senior Engineer'};
const normRole=r=>{const s=String(r==null?'':r).trim();return ROLEMAP[s.toLowerCase()]||s};
function people(doc,wk){return Object.entries((doc&&doc.people)||{}).filter(([k,p])=>!p.del).map(([k,p])=>({key:k,n:p.n||k,r:normRole(p.r),u:p.u||'',w:p.w||{},c:calc(p,wk)}))}
const inScope=p=>!S.roleOff.includes(p.r);
const allRoles=()=>[...new Set(Object.values(S.months).flatMap(d=>Object.values((d&&d.people)||{}).filter(p=>!p.del).map(p=>normRole(p.r))))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
const hasData=id=>people(S.months[id]).some(p=>p.c.e>0||p.c.a>0);
const monthIds=()=>Object.keys(S.months).sort();
const avg=(l,f)=>l.length?l.reduce((x,p)=>x+f(p),0)/l.length:0;
function agg(list){return{n:list.length,t:avg(list,p=>p.c.t),e:avg(list,p=>p.c.e),a:avg(list,p=>p.c.a),s:avg(list,p=>p.c.s),
  prod:avg(list,p=>p.c.prod),eff:avg(list,p=>p.c.eff),occ:avg(list,p=>p.c.occ)}}
function byUnit(id,wk){const l=people(S.months[id],wk).filter(inScope),g={};l.forEach(p=>(g[p.u]=g[p.u]||[]).push(p));
  const us=Object.keys(g).sort((a,b)=>{const i=UNITS.indexOf(a),j=UNITS.indexOf(b);return(i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
  return{us,g,all:agg(l),per:Object.fromEntries(us.map(u=>[u,agg(g[u])]))}}
const cls=x=>x<.8?'bad':x<.9?'warn':'good';
const clsT={bad:'Di bawah 80%',warn:'80% sampai 90%',good:'Di atas 90%'};
const pill=x=>x>0?`<span class="pill ${cls(x)}" title="${clsT[cls(x)]}">${fmtP(x)}</span>`:'<span class="na">–</span>';
const mname=id=>{const d=S.months[id];return d&&d.label?d.label:id};

/* ---------- header ---------- */
function renderHead(){
  const ids=monthIds(),sel=$('#month');
  sel.innerHTML=ids.map(id=>`<option value="${esc(id)}"${id===S.sel?' selected':''}>${esc(mname(id))}</option>`).join('')||'<option>Belum ada data</option>';
  const wdoc=S.months[S.sel],wsel=$('#wk');
  if(S.wk&&!(wdoc&&wdoc.weeks&&wdoc.weeks[S.wk]))S.wk='';
  wsel.innerHTML='<option value="">Seluruh bulan</option>'+WK.filter(k=>wdoc&&wdoc.weeks&&wdoc.weeks[k]).map(k=>`<option value="${k}"${k===S.wk?' selected':''}>${esc(wdoc.weeks[k])}${weekHas(wdoc,k)?'':' · belum ada data'}</option>`).join('');
  $('#wkwrap').hidden=S.tab!=='data';$('#selwrap').hidden=(S.tab==='ringkasan'||S.tab==='impor');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  ['ringkasan','data','input','impor'].forEach(t=>{$('#p-'+t).hidden=t!==S.tab});
}
function renderStatus(msg){const el=$('#status');el.hidden=!msg;el.textContent=msg||''}
function renderActive(){renderHead();({ringkasan:renderDash,data:renderData,input:renderInput,impor:renderImport})[S.tab]()}

/* ---------- ringkasan ---------- */
const periodShort=l=>{l=String(l||'');const m=l.match(/^\s*(\d{1,2})(?:\s+[A-Za-z]+)?\s*-\s*(\d{1,2})\s+([A-Za-z]+)\s*(\d{4})?/);return m?`${+m[1]}-${+m[2]} ${m[3]}${m[4]?' '+m[4]:''}`:l.replace(/\s*\(.*$/,'').trim()};
const hmc=x=>x>0?(x<.8?'hb':x<.9?'hw':'hg'):'';
const pc0=x=>Math.round(x*100)+'%';
const f2=x=>Number(x).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
function wkTitle(id,k){let w=periodShort(((S.months[id]||{}).weeks||{})[k]);if(w&&!/\d{4}/.test(w))w+=' '+id.slice(0,4);return w}
const arrow=(v,pv,pl)=>{if(!(pv>0))return'';const d=(v-pv)*100;
  if(Math.abs(d)<.5)return` <span class="ar eq" title="Sama dengan ${esc(pl)}">▬</span>`;
  return` <span class="ar ${d>0?'up':'dn'}" title="${d>0?'Naik':'Turun'} ${fmtN(Math.abs(d),1)} poin dari ${esc(pl)}">${d>0?'▲':'▼'}</span>`};
function unitTable(title,sub,cur,prev,pl){
  const cell=(a,pa,k)=>`<td class="${hmc(a[k])}">${pc0(a[k])}${prev?arrow(a[k],pa?pa[k]:0,pl):''}</td>`;
  const row=(u,a,pa,tot)=>`<tr${tot?' class="tot"':''}><td>${esc(u)}</td><td>${a.n}</td><td>${f2(a.t)}</td><td>${f2(a.e)}</td><td>${f2(a.a)}</td><td>${f2(a.s)}</td>${cell(a,pa,'prod')}${cell(a,pa,'eff')}${cell(a,pa,'occ')}</tr>`;
  return`<div class="card cmpcard"><div class="bar${/WEEK/.test(title)?' wk':''}">${esc(title)}</div><div class="sub2">${esc(sub)}</div><div class="tw"><table class="cmp"><thead><tr class="ltr"><th></th><th></th><th></th><th>A</th><th>B</th><th>C</th><th>A/C</th><th>A/B</th><th>B/C</th></tr><tr><th class="l">Unit</th><th>Total Resources</th><th>Av # of task</th><th>Av of Effort MD</th><th>Av of Actual MD</th><th>Av of Stock MD</th><th title="Effort ÷ Stock">Productivity</th><th title="Effort ÷ Actual">Effectivity</th><th title="Actual ÷ Stock">Occupancy</th></tr></thead><tbody>${cur.us.map(u=>row(u,cur.per[u],prev&&prev.per[u])).join('')}${row('Grand Total',cur.all,prev&&prev.all,1)}</tbody></table></div></div>`}
function renderDash(){
  const el=$('#p-ringkasan'),mids=monthIds().filter(hasData),wp=weekPoints();
  if(!mids.length){el.innerHTML=emptyState();return}
  const lastM=mids[mids.length-1],lastW=wp[wp.length-1];
  const mid=S.dm&&mids.includes(S.dm)?S.dm:lastM;const mi=mids.indexOf(mid),lm=mi>0?mids[mi-1]:null;let lw=lastW;if(S.dw){const f=wp.find(x=>x.id+'|'+x.k===S.dw);if(f)lw=f}
  const li=lw?wp.indexOf(lw):-1,pw=li>0?wp[li-1]:null,wk=lw?wkTitle(lw.id,lw.k):'',pwt=pw?wkTitle(pw.id,pw.k):'';
  const byM={};wp.forEach(x=>(byM[x.id]=byM[x.id]||[]).push(x));
  const wopts=Object.keys(byM).sort().reverse().map(id=>`<optgroup label="${esc(mname(id))}">${byM[id].slice().reverse().map(x=>`<option value="${esc(x.id+'|'+x.k)}"${lw&&x.id===lw.id&&x.k===lw.k?' selected':''}>${esc(wkTitle(x.id,x.k))}${x===lastW?' (terbaru)':''}</option>`).join('')}</optgroup>`).join('');
  const mopts=mids.slice().reverse().map(id=>`<option value="${esc(id)}"${id===mid?' selected':''}>${esc(mname(id))}${id===lastM?' (terbaru)':''}</option>`).join('');

const weekHas=(doc,k)=>people(doc,k).some(p=>p.c.e>0||p.c.a>0||p.c.t>0);

function shortWk(id,k){const m=String(((S.months[id]||{}).weeks||{})[k]||'').match(/^\s*(\d{1,2})\b/);return(m?(+m[1]):'M'+k)+' '+MON[+id.slice(5)-1]}

  if(S.gran==='w')return weekPoints().map(p=>({short:shortWk(p.id,p.k),title:mname(p.id)+' · '+S.months[p.id].weeks[p.k],a:byUnit(p.id,p.k)}));

function drawChart(){
  const box=$('#chartbox'),P=chartPoints(),k=S.metric;
  if(!P.length){box.innerHTML='<div class="empty">Belum ada data untuk ditampilkan.</div>';return}
  const A=P.map(p=>p.a),units=[];
  UNITS.forEach(u=>{const v=A.map(a=>a.per[u]?a.per[u][k]:null);if(v.some(x=>x>0))units.push({u,v})});
  const skipped=UNITS.filter(u=>A.some(a=>a.per[u])&&!units.find(x=>x.u===u));
  const W=720,H=300,L=44,R=76,T=14,B=30,mx=Math.max(1.25,Math.ceil(Math.max(...units.flatMap(x=>x.v.map(y=>y||0)))/.25)*.25),dr=P.length>12?3:4,step=Math.ceil(P.length/9);

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren ${METRICS[k][0]} per unit">`;
  for(let v=0;v<=mx+1e-9;v+=.25){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"${v===1?' stroke-dasharray="4 3"':''}/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`}
  P.forEach((p,i)=>{if(i%step===0)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.short)}</text>`});
  const ends=[];
  units.forEach(({u,v})=>{const c=`var(${SER[u]||'--muted'})`,pts=v.map((y,i)=>y==null?null:[X(i),Y(y)]).filter(Boolean);
    if(pts.length>1)s+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${dr}" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`});
    if(pts.length)ends.push({u,x:pts[pts.length-1][0],y:pts[pts.length-1][1],c})});
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  ends.forEach(e=>{s+=`<text x="${e.x+10}" y="${e.y+4}">${esc(e.u)}</text>`});
  s+=`<line id="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect id="hit" x="${L-10}" y="0" width="${W-L-R+30}" height="${H}" fill="transparent"/></svg>`;
  const lg=units.map(x=>`<span><span class="sw" style="background:var(${SER[x.u]||'--muted'})"></span>${esc(x.u)}</span>`).join('');
  const tb=`<details style="margin-top:12px"><summary>Lihat angka</summary><div class="tw"><table><thead><tr><th>Unit</th>${P.map(p=>`<th>${esc(p.short)}</th>`).join('')}</tr></thead><tbody>${units.map(x=>`<tr><td>${esc(x.u)}</td>${x.v.map(y=>`<td>${y>0?fmtP(y):'–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  box.innerHTML=`<div class="legend" style="margin-bottom:8px">${lg}</div><div class="chart">${s}<div class="tip" hidden></div></div>`+
    (skipped.length?`<div class="hint" style="margin-top:8px">${skipped.join(', ')} tidak ditampilkan karena tidak mencatat task (nilai ${METRICS[k][0]} selalu 0).</div>`:'')+tb;
  const ch=box.querySelector('.chart'),svg=ch.querySelector('svg'),tip=ch.querySelector('.tip'),xh=svg.querySelector('#xh');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;let bi=0,bd=1e9;P.forEach((p,i)=>{const d=Math.abs(X(i)-px);if(d<bd){bd=d;bi=i}});
    xh.setAttribute('x1',X(bi));xh.setAttribute('x2',X(bi));xh.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${esc(P[bi].title)}</b>`+units.map(x=>`<div><span><span class="sw" style="background:var(${SER[x.u]||'--muted'})"></span>${esc(x.u)}</span><span>${x.v[bi]>0?fmtP(x.v[bi]):'–'}</span></div>`).join('');
    tip.hidden=false;const tx=X(bi)/W*r.width,tw=tip.offsetWidth;tip.style.left=(tx+tw+20>r.width?tx-tw-12:tx+12)+'px';tip.style.top='8px'};
  svg.querySelector('#hit').addEventListener('pointermove',move);

const serialDate=n=>new Date(Math.round((n-25569)*864e5));
const r4=x=>Math.round(x*1e4)/1e4;
function parseRows(rows){
  const isDate=v=>typeof v==='number'&&v>40000&&v<80000;
  const starts=[];
  rows.forEach((r,i)=>{if(isDate(r[0])&&r.slice(1,6).every(x=>x==null||x===''))starts.push(i)});
  const out=[];
  starts.forEach((si,bi)=>{
    const end=bi+1<starts.length?starts[bi+1]:rows.length,d=serialDate(rows[si][0]);
    const id=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
    let lr=-1,hr=-1;
    for(let i=si+1;i<Math.min(end,si+12);i++){const r=rows[i];
      const isH=String(r[0]==null?'':r[0]).trim()==='Name';
      if(lr<0&&!isH&&typeof r[3]==='string'&&r[3].trim())lr=i;
      if(isH){hr=i;break}}
    if(hr<0)return;
    const weeks={};
    WK.forEach((w,j)=>{const v=lr>=0?rows[lr][3+8*j]:null;weeks[w]=typeof v==='string'&&v.trim()?v.trim():'Minggu '+w});
    const ppl={},used=new Set();let withData=0;
    for(let i=hr+1;i<end;i++){
      const r=rows[i],n=String(r[0]==null?'':r[0]).trim();
      if(n==='Grand Total')break;if(!n)continue;
      const b=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';let k=b,c=2;while(used.has(k))k=b+'-'+c++;used.add(k);
      const w={};
      WK.forEach((wk,j)=>{const c0=3+8*j,v=[0,1,2,3].map(o=>typeof r[c0+o]==='number'?r[c0+o]:null),st=typeof r[c0+7]==='string'?r[c0+7].trim():'';
        if(v.some(x=>x!=null)||st)w[wk]={t:r4(v[0]||0),e:r4(v[1]||0),a:r4(v[2]||0),s:r4(v[3]||0),st}});
      if(Object.keys(w).length)withData++;
      ppl[k]={n,r:normRole(r[1])||'-',u:String(r[2]==null?'':r[2]).trim()||'-',w}}
    out.push({id,label:MONF[d.getUTCMonth()]+' '+d.getUTCFullYear(),weeks,people:ppl,n:Object.keys(ppl).length,withData});
  });
  return out}

    catch(err){b.disabled=false;I.msg={err:1,t:(n?n+' bulan masuk, lalu berhenti. ':'')+(err&&err.code==='invalid_argument'?'Akun Anda tidak punya izin mengubah data.':'Gagal menyimpan. Coba lagi.')};$('#impmsg2').className='msg err';$('#impmsg2').textContent=I.msg.t}}

/* ---------- impor laporan per unit ---------- */
S.imu={files:[],sel:{},addNew:true,msg:null,confirm:false};
const MI={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,agt:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
const mIdx=s=>MI[String(s||'').toLowerCase().slice(0,3)];
const SKIP=/^(total|average|grand total|name)$/i;
const cleanName=s=>String(s==null?'':s).replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,'').trim();
const nv=v=>{if(typeof v==='number')return isFinite(v)?v:null;if(v==null)return null;const s=String(v).trim();if(!s||s.endsWith('%'))return null;const n=parseFloat(s.replace(',','.'));return isFinite(n)?n:null};
function parseRange(label){
  const s=String(label==null?'':label);let m=s.match(/(\d{1,2})-([A-Za-z]{3,9})-(\d{4})\s*-\s*(\d{1,2})-([A-Za-z]{3,9})-(\d{4})/);
  if(m){const a=mIdx(m[2]),b=mIdx(m[5]);if(a==null||b==null)return null;return{s:Date.UTC(+m[3],a,+m[1]),e:Date.UTC(+m[6],b,+m[4])}}
  m=s.match(/(\d{1,2})\s*(?:([A-Za-z]{3,9})\s*)?-\s*(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);
  if(!m)return null;
  const y=+m[5],m2=mIdx(m[4]),m1=m[2]?mIdx(m[2]):m2;if(m1==null||m2==null)return null;
  return{s:Date.UTC(m1>m2?y-1:y,m1,+m[1]),e:Date.UTC(y,m2,+m[3])}}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const lines=text.split(/\r?\n/);
  const delim=lines.slice(0,15).some(l=>l.split(';').length>5)?';':',';
  return lines.map(line=>{const out=[];let cur='',q=false;
    for(let i=0;i<line.length;i++){const c=line[i];
      if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
      else if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}
    out.push(cur);return out})}
function mkRow(n,role,v,st){return{n,r:role,t:r4(v[0]||0),e:r4(v[1]||0),a:r4(v[2]||0),s:r4(v[3]||0),st:st||''}}
function parseUnitRows(rows){
  let li=-1;for(let i=0;i<Math.min(8,rows.length);i++){if((rows[i]||[]).some(c=>typeof c==='string'&&parseRange(c))){li=i;break}}
  if(li<0)return null;
  let hi=-1;for(let i=li;i<Math.min(li+6,rows.length);i++){if((rows[i]||[]).some(c=>typeof c==='string'&&/^#\s*of\s*task/i.test(c.trim()))){hi=i;break}}
  if(hi<0)return null;
  let nc=0;for(let i=li;i<=hi;i++){const j=(rows[i]||[]).findIndex(c=>typeof c==='string'&&/^name/i.test(cleanName(c)));if(j>=0){nc=j;break}}
  const blocks=[];rows[li].forEach((c,j)=>{if(typeof c==='string'){const rg=parseRange(c);if(rg)blocks.push({col:j,label:cleanName(c),range:rg,rows:[]})}});
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[],n=cleanName(r[nc]);if(!n||SKIP.test(n))continue;
    const role=String(r[nc+1]==null?'':r[nc+1]).trim();
    blocks.forEach(b=>{const v=[0,1,2,3].map(o=>nv(r[b.col+o]));if(v.every(x=>x==null))return;const st=r[b.col+7];
      b.rows.push(mkRow(n,role,v,typeof st==='string'?st.trim():''))})}
  return blocks}
function parsePCDRows(rows){
  const wi=rows.findIndex(r=>String((r||[])[0]||'').includes('Weekly Summary'));if(wi<0)return null;
  const hdr=rows[wi+1]||[],groups=[];
  hdr.forEach((c,j)=>{const m=String(c||'').match(/([A-Za-z]+)\s+(\d{4})\s+W(\d+)\s+Task/i);if(m&&mIdx(m[1])!=null)groups.push({col:j,mon:mIdx(m[1]),y:+m[2],k:+m[3],rows:[]})});
  if(!groups.length)return null;
  for(let i=wi+2;i<rows.length;i++){const r=rows[i]||[],n=cleanName(r[0]);if(!n||SKIP.test(n))continue;
    groups.forEach(g=>{const v=[0,1,2,3].map(o=>nv(r[g.col+o]));if(v.every(x=>x==null))return;g.rows.push(mkRow(n,'',v,''))})}
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<wi;i++){const m=String((rows[i]||[])[0]||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m){const t=Date.UTC(+m[1],+m[2]-1,+m[3]);mn=Math.min(mn,t);mx=Math.max(mx,t)}}
  groups.forEach(g=>{g.label=MONF[g.mon]+' '+g.y+' minggu '+g.k;
    if(groups.length===1&&isFinite(mn))g.range={s:mn,e:mx};else g.direct={id:g.y+'-'+String(g.mon+1).padStart(2,'0'),k:String(g.k)}});
  return groups}
function parseQERows(rows){
  let range=null,label='';
  for(const r of rows.slice(0,6)){const x=parseRange((r||[])[0]);if(x){range=x;label=String(r[0]).replace(/^Periode data:\s*/i,'');break}}
  const out=[];let inT=false;
  for(const r of rows){const c0=cleanName((r||[])[0]);
    if(c0==='Name'&&/task/i.test(String(r[2]||''))){inT=true;continue}
    if(!inT)continue;if(!c0){inT=false;continue}if(SKIP.test(c0))continue;
    const v=[2,3,4,5].map(j=>nv(r[j]));if(v.every(x=>x==null))continue;
    out.push(mkRow(c0,String(r[1]||'').trim(),v,''))}
  if(!range||!out.length)return null;
  return[{label:'Periode '+label,range,rows:out}]}
function detectUnit(name){for(const u of UNITS){if(new RegExp('(^|[^a-z])'+u+'([^a-z]|$)','i').test(name))return u}return''}
async function readUnitFile(f){
  const name=f.name,ext=(name.split('.').pop()||'').toLowerCase();let blocks=null;
  if(ext==='csv'){const rows=parseCSV(await f.text());blocks=parsePCDRows(rows)||parseQERows(rows)}
  else{if(typeof XLSX==='undefined')throw new Error('xlsx');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellStyles:false});
    blocks=parseUnitRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null}))}
  return{name,unit:detectUnit(name),blocks:blocks||[],err:blocks&&blocks.length?'':'Susunan file tidak dikenali.'}}
const normName=n=>String(n||'').toLowerCase().replace(/@.*$/,'').replace(/[^a-z0-9]/g,'');
function findPerson(doc,unit,name){
  const nn=normName(name),c=Object.entries((doc&&doc.people)||{}).filter(([k,p])=>!p.del&&p.u===unit);
  let m=c.filter(([k,p])=>normName(p.n)===nn);if(m.length)return m[0][0];
  m=c.filter(([k,p])=>{const a=normName(p.n);return nn.length>=8&&a.length>=8&&(a.startsWith(nn)||nn.startsWith(a))});
  return m.length===1?m[0][0]:null}
function findSlot(range){
  if(!range)return null;
  for(const id of monthIds()){const y=+id.slice(0,4),m=+id.slice(5)-1,doc=S.months[id];
    for(const k of WK){const mm=String((doc.weeks||{})[k]||'').match(/^\s*(\d{1,2})\b/);if(!mm)continue;
      const t=Date.UTC(y,m,+mm[1]);if(t>=range.s&&t<=range.e)return{id,k}}}
  return null}
function buildPlan(){
  const plan=[];let skipped=0;
  S.imu.files.forEach((f,fi)=>(f.blocks||[]).forEach((b,bi)=>{
    let tg=null;
    if(b.direct){const d=S.months[b.direct.id];if(d&&(d.weeks||{})[b.direct.k]!=null)tg=b.direct}else tg=findSlot(b.range);
    if(!tg||!b.rows.length||!f.unit){skipped++;return}
    const doc=S.months[tg.id];let nm=0,nn=0,ex=0;const newNames=[];
    const keys=b.rows.map(r=>{const k=findPerson(doc,f.unit,r.n);
      if(k){nm++;const w=(doc.people[k].w||{})[tg.k];if(w&&(w.t||w.e||w.a))ex++}else{nn++;newNames.push(r.n.split('@')[0])}return k});
    plan.push({fi,bi,f,b,tg,keys,nm,nn,ex,newNames,id:fi+':'+bi})}));

function buildUpdates(items,addNew){
  const out={},stats={weeks:items.length,upd:0,add:0};
  items.forEach(({f,b,tg,keys})=>{const U=out[tg.id]=out[tg.id]||{people:{},nk:{}};
    b.rows.forEach((r,i)=>{let key=keys[i];
      if(!key){if(!addNew)return;const nk=f.unit+'|'+normName(r.n);
        key=U.nk[nk];if(!key){key=U.nk[nk]=(r.n.split('@')[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x')+'-'+Math.random().toString(36).slice(2,6);stats.add++;
          U.people[key]={n:r.n.split('@')[0],r:normRole(r.r)||'-',u:f.unit,w:{}}}}
      else stats.upd++;
      const P=U.people[key]=U.people[key]||{};P.w=P.w||{};P.w[tg.k]={t:r.t,e:r.e,a:r.a,s:r.s,st:r.st}})});

    ${plan.length?`<div class="tw" style="margin-top:8px"><table id="plan"><thead><tr><th class="l">Impor</th><th class="l">Unit</th><th class="l">Minggu di aplikasi</th><th class="l">Periode di file</th><th>Orang di file</th><th>Cocok</th><th>Baru</th><th class="l">Status</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${skipped?`<p class="hint">${skipped} blok minggu di file diabaikan karena tidak cocok dengan minggu mana pun di aplikasi atau tidak berisi data.</p>`:''}
      <div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" id="addnew"${I.addNew?' checked':''}> Tambahkan orang yang belum ada di daftar</label></div>
      ${I.addNew&&nNew?`<details style="margin-top:6px"><summary>${nNew} orang baru akan ditambahkan</summary><p class="hint">${Object.entries(newBy).map(([u,s])=>esc(u)+': '+[...s].map(esc).join(', ')).join('<br>')}</p></details>`:''}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="imugo"${ro()}>${I.confirm?'Klik lagi untuk menimpa':'Impor minggu terpilih'}</button></div>
      <p class="hint">Orang yang tidak ada di file tidak diubah. Menimpa minggu yang sudah ada mengganti angkanya dengan isi file.</p>`:(I.files.length&&!I.files.some(f=>f.err)?'<div class="empty">Tidak ada minggu di file ini yang cocok dengan minggu di aplikasi.</div>':'')}</div>`;
  $('#xu').onchange=async e=>{
    const fl=[...e.target.files];if(!fl.length)return;I.msg={t:'Membaca '+fl.length+' file…'};$('#imumsg').textContent=I.msg.t;
    for(const f of fl){let r;try{r=await readUnitFile(f)}catch(err){r={name:f.name,unit:detectUnit(f.name),blocks:[],err:err&&err.message==='xlsx'?'Pembaca Excel belum termuat. Muat ulang halaman.':'File tidak bisa dibaca.'}}
      const i=I.files.findIndex(x=>x.name===r.name);if(i>=0)I.files[i]=r;else I.files.push(r)}
    I.sel={};I.confirm=false;I.msg=null;renderUnitImport()};
  el.querySelectorAll('[data-fu]').forEach(s=>{s.onchange=()=>{I.files[+s.dataset.fu].unit=s.value;I.sel={};I.confirm=false;renderUnitImport()}});
  el.querySelectorAll('[data-rm]').forEach(b=>{b.onclick=()=>{I.files.splice(+b.dataset.rm,1);I.sel={};I.confirm=false;renderUnitImport()}});
  const pt=$('#plan');if(pt)pt.onchange=e=>{const c=e.target.closest('input[data-id]');if(c){I.sel[c.dataset.id]=c.checked;I.confirm=false;renderUnitImport()}};
  const an=$('#addnew');if(an)an.onchange=e=>{I.addNew=e.target.checked;renderUnitImport()};
  const go2=$('#imugo');
  if(go2)go2.onclick=async()=>{
    const picked=plan.filter(p=>I.sel[p.id]);
    if(!picked.length){I.msg={err:1,t:'Pilih minimal satu minggu.'};renderUnitImport();return}
    if(picked.some(p=>p.ex)&&!I.confirm){I.confirm=true;renderUnitImport();return}
    go2.disabled=true;I.confirm=false;const{out,stats}=buildUpdates(picked,I.addNew);let n=0;
    try{for(const id of Object.keys(out)){await S.db.doc('months/'+id).update({people:out[id].people});n++}
      I.files=[];I.sel={};I.msg={t:`Selesai: ${stats.weeks} minggu diimpor, ${stats.upd} orang diperbarui, ${stats.add} orang baru.`};renderUnitImport()}
    catch(err){I.msg={err:1,t:(n?n+' bulan sudah tersimpan, lalu berhenti. ':'')+(err&&err.code==='invalid_argument'?'Akun Anda tidak punya izin mengubah data.':'Gagal menyimpan. Coba lagi.')};renderUnitImport()}}
}

/* ---------- misc ---------- */
function emptyState(){return`<div class="card empty"><h2>${S.loaded?'Belum ada data':'Memuat data…'}</h2><p>${S.loaded?'Data dari Excel belum dimuat ke aplikasi ini.':'Mohon tunggu sebentar.'}</p></div>`}
function go(t){S.tab=t;if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);renderActive()}
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)};
$('#wk').onchange=e=>{S.wk=e.target.value;renderActive()};
$('#month').onchange=e=>{S.sel=e.target.value;S.wk='';S.dirty=false;S.msg=null;S.confirmDel=false;renderActive()};
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(['ringkasan','data','input','impor'].includes(t)&&t!==S.tab){S.tab=t;renderActive()}});
{const t=location.hash.slice(1);if(['ringkasan','data','input','impor'].includes(t))S.tab=t}

async function boot(){
  renderActive();
  let db=null,user=null;
  try{db=await claude.use('db')}catch(e){}
  try{user=await claude.use('user')}catch(e){}
  if(!db){S.loaded=true;renderStatus('Data tersimpan tidak bisa dibuka di tampilan ini. Buka halaman ini dari akun Claude Anda.');renderActive();return}
  S.db=db;
  try{const c=user&&user.can?await user.can('data.write'):null;if(c===false)S.canWrite=false}catch(e){}
  const timer=setTimeout(()=>renderStatus('Data belum bisa dijangkau. Periksa koneksi internet Anda.'),10000);
  db.collection('months').onSnapshot(snap=>{
    clearTimeout(timer);if(!snap.metadata.fromCache)renderStatus('');
    S.months={};snap.docs.forEach(d=>{if(d.exists)S.months[d.id]=d.data()});S.loaded=true;
    const ids=monthIds();
    if(!S.sel||!S.months[S.sel])S.sel=ids.filter(hasData).pop()||ids.pop()||null;
    renderActive();
  },err=>{clearTimeout(timer);S.loaded=true;renderStatus(err&&err.code==='revoked'?'Akses ke data dicabut.':'Data tidak bisa dimuat.');renderActive()});
}
boot();
})();
</script>
